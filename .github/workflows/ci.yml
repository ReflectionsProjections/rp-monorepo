name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which parts of the monorepo changed. Each downstream job reads one
  # of these outputs and skips itself when its area was untouched.
  changes:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Each filter becomes a "true" or "false" output. The rest of the
          # workflow uses those booleans to avoid running unrelated checks.
          filters: |
            root:
              - '.github/workflows/**'
              - '.gitignore'
              - 'README.md'
              - 'AGENTS.md'
              - 'setup.sh'
              - 'docker-compose.yml'
              - 'dev-env.code-workspace'
              - 'scripts/**'
            api:
              - 'services/api/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/**'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/**'

  # Only runs when shared tooling, repo docs, workflow files, or local infra
  # wiring changes.
  root:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Verify root scripts
        run: ./scripts/verify-root.sh

  # Only runs when API code changes, or when workflow / local DB stack changes
  # could affect API verification.
  api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    # The credentials below are fixture values for the ephemeral local
    # Supabase-style test stack started inside CI, not shared production creds.
    env:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ci-supabase-jwt-secret-2026-long-enough-for-tests
      JWT_EXPIRY: 3600
      PGRST_DB_SCHEMAS: public
      SUPABASE_URL: http://localhost:8000
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTcwNDA2NzIwMCwiZXhwIjoyNTI0NjA4MDAwLCJyb2xlIjoiYW5vbiJ9.V56Fx5RS_LQpdttJ9BN1dnes_jr7orfFeDgAMNhpqT0
      SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTcwNDA2NzIwMCwiZXhwIjoyNTI0NjA4MDAwLCJyb2xlIjoic2VydmljZV9yb2xlIn0.hqx87nxUtsYgFHpIDf2gLYOV6L8QTQJc3JgVmn4r_28
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTcwNDA2NzIwMCwiZXhwIjoyNTI0NjA4MDAwLCJyb2xlIjoic2VydmljZV9yb2xlIn0.hqx87nxUtsYgFHpIDf2gLYOV6L8QTQJc3JgVmn4r_28
      DASHBOARD_USERNAME: ci
      DASHBOARD_PASSWORD: ci
      FORCE_COLOR: true
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: services/api/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - uses: docker/setup-buildx-action@v4
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Format
        run: yarn format:check
      - name: Lint
        run: yarn lint:check
      # These containers provide the local Postgres + Kong + PostgREST stack
      # that Jest uses during API tests.
      - name: Start local database stack
        run: docker compose -f ../../docker-compose.yml up -d db kong rest
      - name: Test
        run: yarn test
      # Always clean up the local stack, even if build, lint, or tests fail.
      - name: Stop local database stack
        if: always()
        run: docker compose -f ../../docker-compose.yml down -v

  # Only runs when the web workspace changes, or when workflow changes could
  # affect how web checks are executed.
  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: apps/web/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck
        run: yarn type-check
      - name: Lint
        run: yarn lint
      - name: Format
        run: yarn format:check

  # Only runs when the mobile workspace changes, or when workflow changes could
  # affect how mobile checks are executed.
  mobile:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: apps/mobile/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify
        run: yarn verify

  # Runs after all workspace jobs
  # format check
  format:
    runs-on: ubuntu-latest
    needs:
      - api
      - web
      - mobile
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check

  # This final job always runs so branch protection can depend on one stable
  # check name. It fails only when a conditional job actually failed; jobs that
  # were skipped because their filter was false are treated as expected.
  ci:
    runs-on: ubuntu-latest
    needs:
      - root
      - api
      - web
      - mobile
      - format
    if: always()
    steps:
      - name: Finalize
        run: |
          if [[ "${{ needs.root.result }}" == "failure" || "${{ needs.api.result }}" == "failure" || "${{ needs.web.result }}" == "failure" || "${{ needs.mobile.result }}" == "failure" || "${{ needs.format.result }}" == "failure" ]]; then
            exit 1
          fi
