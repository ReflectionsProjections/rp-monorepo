name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which parts of the monorepo changed. Each downstream job reads one
  # of these outputs and skips itself when its area was untouched.
  changes:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
      db: ${{ steps.filter.outputs.db }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Each filter becomes a "true" or "false" output. The rest of the
          # workflow uses those booleans to avoid running unrelated checks.
          filters: |
            root:
              - '.github/workflows/**'
              - '.gitignore'
              - 'README.md'
              - 'AGENTS.md'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'setup.sh'
              - 'scripts/**'
            db:
              - 'services/db/**'
              - '.github/workflows/**'
            api:
              - 'services/api/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'scripts/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - '.github/workflows/**'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/**'

  # Only runs when shared tooling, repo docs, workflow files, or local infra
  # wiring changes.
  root:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Verify root scripts
        run: ./scripts/verify-root.sh

  # Only runs when database schema, local DB stack wiring, or workflow changes
  # could affect database behavior.
  db:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: |
            services/db/yarn.lock
      - name: Install DB tooling dependencies
        working-directory: services/db
        run: yarn install --immutable
      - name: Verify database Compose configs
        working-directory: services/db
        run: yarn verify

  # Runs when API code changes. Also runs after DB changes so API verification
  # proves the current schema and API still work together.
  api:
    runs-on: ubuntu-latest
    needs:
      - changes
      - db
    if: always() && (needs.changes.outputs.api == 'true' || needs.changes.outputs.db == 'true') && (needs.db.result == 'success' || needs.db.result == 'skipped')
    env:
      FORCE_COLOR: true
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            services/api/yarn.lock
            services/db/yarn.lock
      - name: Install root orchestration dependencies
        working-directory: .
        run: yarn install --immutable
      - uses: docker/setup-buildx-action@v4
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install DB tooling dependencies
        working-directory: services/db
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Format
        run: yarn format:check
      - name: Lint
        run: yarn lint:check
      - name: Test
        working-directory: .
        run: yarn api:test

  # Only runs when the web workspace changes, or when workflow changes could
  # affect how web checks are executed.
  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: apps/web/yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck
        run: yarn type-check
      - name: Lint
        run: yarn lint
      - name: Format
        run: yarn format:check

  # Only runs when the mobile workspace changes, or when workflow changes could
  # affect how mobile checks are executed.
  mobile:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: apps/mobile/yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify
        run: yarn verify

  # This final job always runs so branch protection can depend on one stable
  # check name. It fails only when a conditional job actually failed; jobs that
  # were skipped because their filter was false are treated as expected.
  ci:
    runs-on: ubuntu-latest
    needs:
      - root
      - db
      - api
      - web
      - mobile
    if: always()
    steps:
      - name: Finalize
        run: |
          if [[ "${{ needs.root.result }}" == "failure" || "${{ needs.db.result }}" == "failure" || "${{ needs.api.result }}" == "failure" || "${{ needs.web.result }}" == "failure" || "${{ needs.mobile.result }}" == "failure" ]]; then
            exit 1
          fi
